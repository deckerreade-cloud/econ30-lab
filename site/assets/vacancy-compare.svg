<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-label="Vacancy rates 2015-2024: San Francisco rises to 36.6 percent while Manhattan and DC stay lower">
  <rect width="960" height="340" fill="#11192c"/>
  <text x="72" y="22" fill="#8a93a6" font-family="Inter, sans-serif" font-size="13" letter-spacing="0.08em">VACANCY COMPARISON · Q4 SNAPSHOTS · SAN FRANCISCO DIVERGES</text>
  <line x1="72" y1="248" x2="936" y2="248" stroke="rgba(230,232,238,0.15)"/>
  <line x1="72" y1="32" x2="72" y2="248" stroke="rgba(230,232,238,0.15)"/>
  <g transform="translate(72,32)">
    <polyline fill="none" stroke="#f26b5e" stroke-width="3.75" points="0,207.2 96,205.4 192,209.8 288,215.4 384,222.8 480,148.6 576,111.4 672,81.4 768,36.6 864,19.2"/>
    <polyline fill="none" stroke="#ffd166" stroke-width="2.25" opacity="0.85" points="0,188.6 96,182.4 192,175.2 288,178.2 384,180.6 480,155.2 576,138.6 672,130.6 768,135.4 864,138.6"/>
    <polyline fill="none" stroke="#3db7a0" stroke-width="2.25" opacity="0.85" points="0,145.2 96,141.4 192,140.2 288,140.8 384,139.6 480,131.8 576,125.2 672,120.8 768,117.0 864,113.4"/>
    <text x="864" y="8" fill="#f26b5e" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="end">SF 5.2% → 36.6% (+31 pp)</text>
    <text x="72" y="292" fill="#8a93a6" font-family="Inter, sans-serif" font-size="12">2015</text>
    <text x="936" y="292" fill="#8a93a6" font-family="Inter, sans-serif" font-size="12" text-anchor="end">2024</text>
    <text x="-48" y="124" fill="#8a93a6" font-family="Inter, sans-serif" font-size="12" transform="rotate(-90 -48 124)" text-anchor="middle">Vacancy %</text>
    <g transform="translate(0,268)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#f26b5e" stroke-width="3.5"/>
      <text x="26" y="5" fill="#f26b5e" font-size="11" font-weight="600">San Francisco</text>
      <line x1="140" y1="0" x2="160" y2="0" stroke="#ffd166" stroke-width="2.25"/>
      <text x="166" y="5" fill="#8a93a6" font-size="11">Manhattan</text>
      <line x1="260" y1="0" x2="280" y2="0" stroke="#3db7a0" stroke-width="2.25"/>
      <text x="286" y="5" fill="#8a93a6" font-size="11">Washington, D.C.</text>
    </g>
  </g>
</svg>
